version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: pramukhraj_db_dev
    restart: unless-stopped
    # env_file: 
    #   - ../../pramukhraj-foods/.env # Steps out of DB_Folder into Docker_Folder
    environment:
      POSTGRES_DB: ${VITE_DB_NAME}
      POSTGRES_USER: ${VITE_DB_USER}
      POSTGRES_PASSWORD: ${VITE_DB_PASSWORD}
      TZ: ${VITE_DB_TIMEZONE}
    ports:
      - "5433:5432"
    volumes:
      # Creates the data folder next to your .env files in Docker_Folder
      - ../pg-dev-data:/var/lib/postgresql/data
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge